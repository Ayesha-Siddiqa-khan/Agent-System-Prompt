apiVersion: v1
kind: Service
metadata:
  name: cloud-native-service
  labels:
    app.kubernetes.io/name: cloud-native-service
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloud-native-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
